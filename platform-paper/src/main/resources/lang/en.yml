# PV-Transcribe messages (English). Colors: &0-&f, &#RRGGBB. Placeholders in {braces}.
prefix: "&8[&bPV-Transcribe&8] &r"
no-permission: "&cYou don't have permission to do that."
player-only: "&cOnly players can use this command."
reloaded: "&aConfiguration reloaded."
subtitles-hidden: "&7Speech bubbles are now hidden for you. Show them again with &f/vtt toggle"
subtitles-shown: "&aSpeech bubbles are visible again."
player-not-found: "&cPlayer {player} not found."
world-not-found: "&cWorld {world} not found."
player-transcription-on: "&aTranscription enabled for {player}."
player-transcription-off: "&eTranscription disabled for {player}."
world-transcription-on: "&aTranscription enabled in world {world}."
world-transcription-off: "&eTranscription disabled in world {world}."
engine-changed: "&aSpeech engine: &f{engine}&a. It loads in the background, check &f/vtt status"
engine-unknown: "&cUnknown engine {engine}. List: /vtt engine"
language-changed: "&aRecognition language: &f{language}"
config-usage: "&7Usage: &f/vtt set <option> <value>&7, list options: &f/vtt get [section]"
config-unknown: "&cUnknown option {option}. List: /vtt get"
config-bad-value: "&cValue {value} does not fit {option}."
config-set: "&a{option} = &f{value}&a (saved to config.yml and applied)"
demo-phrase: "Hey everyone, let's go to the mine today!"
demo-started: "&aDemo phrase above {player} (visible to players nearby; your own bubble is visible in third-person view if subtitles.visibility.show-to-self is true)."
help:
  - "&b/vtt toggle &7- hide/show speech bubbles for yourself"
  - "&b/vtt status &7- engine state and load"
  - "&b/vtt reload &7- reload the configuration"
  - "&b/vtt demo [player] [text] &7- demo speech bubble without a microphone"
  - "&b/vtt get [section] &7- show settings"
  - "&b/vtt set <option> <value> &7- change any setting (Tab completes)"
  - "&b/vtt engine <auto|vosk|t-one|deepgram|openai> &7- switch the speech engine"
  - "&b/vtt language <en|ru|...|auto> &7- recognition language"
  - "&b/vtt player <name> <on|off> &7- transcription of a player"
  - "&b/vtt world <world> <on|off> &7- transcription in a world"
  - "&7GitHub: &fhttps://github.com/ArabKustam/Plasma-Voice-Transcribe"
  - "&7Author Discord: &farab_kustam"
  - "&7Plasmo Voice Discord: &fhttps://discord.com/invite/uueEqzwCJJ"
