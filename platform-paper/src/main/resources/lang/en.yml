# PV-Transcribe messages (English). Colors: &0-&f, &#RRGGBB. Placeholders in {braces}.
prefix: "&8[&bPV-Transcribe&8] &r"
no-permission: "&cYou don't have permission to do that."
player-only: "&cOnly players can use this command."
reloaded: "&aConfiguration reloaded."
subtitles-hidden: "&7Speech bubbles are now hidden for you. Show them again with &f/pvt toggle"
subtitles-shown: "&aSpeech bubbles are visible again."
player-not-found: "&cPlayer {player} not found."
world-not-found: "&cWorld {world} not found."
player-transcription-on: "&aTranscription enabled for {player}."
player-transcription-off: "&eTranscription disabled for {player}."
world-transcription-on: "&aTranscription enabled in world {world}."
world-transcription-off: "&eTranscription disabled in world {world}."
engine-changed: "&aSpeech engine: &f{engine}&a. It loads in the background, check &f/pvt status"
engine-unknown: "&cUnknown engine {engine}. List: /pvt engine"
language-changed: "&aRecognition language: &f{language}"
config-usage: "&7Usage: &f/pvt set <option> <value>&7, list options: &f/pvt get [section]"
config-unknown: "&cUnknown option {option}. List: /pvt get"
config-bad-value: "&cValue {value} does not fit {option}."
config-set: "&a{option} = &f{value}&a (saved to config.yml and applied)"
help:
  - "&b/pvt toggle &7- hide/show speech bubbles for yourself"
  - "&b/pvt status &7- engine state and load"
  - "&b/pvt reload &7- reload the configuration"
  - "&b/pvt get [section] &7- show settings"
  - "&b/pvt set <option> <value> &7- change any setting (Tab completes)"
  - "&b/pvt engine <auto|vosk|t-one|deepgram|openai> &7- switch the speech engine"
  - "&b/pvt language <en|ru|...|auto> &7- recognition language"
  - "&b/pvt player <name> <on|off> &7- transcription of a player"
  - "&b/pvt world <world> <on|off> &7- transcription in a world"
